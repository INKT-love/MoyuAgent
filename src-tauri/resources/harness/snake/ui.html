<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        font-family: "DM Sans", "Noto Sans SC", system-ui, sans-serif;
        color: #355a43;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: #f8faf9;
      }
      body {
        padding: 10px 12px 12px;
        user-select: none;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
        font-size: 11px;
        color: #5d7265;
      }
      .bar strong { color: #276554; font-size: 13px; }
      canvas {
        display: block;
        width: 224px;
        height: 224px;
        background: #eef3f0;
        border: 1px solid #dce4de;
        border-radius: 6px;
      }
      .hint {
        margin-top: 8px;
        font-size: 10px;
        color: #8a988f;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <span>分数 <strong id="score">0</strong></span>
      <span id="status">点击后方向键 / WASD</span>
    </div>
    <canvas id="board" width="224" height="224" tabindex="0"></canvas>
    <div class="hint">空格暂停 · R 重开 · 点画布再按键</div>
    <script>
      const SIZE = 16;
      const CELL = 14;
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const statusEl = document.getElementById("status");
      let snake, dir, pending, food, score, tick, dead, paused;

      const same = (a, b) => a.x === b.x && a.y === b.y;
      const occupied = (p) => snake.some((s) => same(s, p));
      function spawnFood() {
        let next;
        do {
          next = { x: Math.floor(Math.random() * SIZE), y: Math.floor(Math.random() * SIZE) };
        } while (occupied(next));
        food = next;
      }
      function reset() {
        snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];
        dir = { x: 1, y: 0 };
        pending = dir;
        score = 0;
        dead = false;
        paused = false;
        scoreEl.textContent = "0";
        statusEl.textContent = "点击后方向键 / WASD";
        spawnFood();
        draw();
      }
      function draw() {
        ctx.fillStyle = "#eef3f0";
        ctx.fillRect(0, 0, 224, 224);
        ctx.fillStyle = "#ad6249";
        ctx.beginPath();
        ctx.roundRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6, 3);
        ctx.fill();
        snake.forEach((part, i) => {
          ctx.fillStyle = i === 0 ? "#1e4d3f" : "#276554";
          ctx.beginPath();
          ctx.roundRect(part.x * CELL + 1, part.y * CELL + 1, CELL - 2, CELL - 2, 3);
          ctx.fill();
        });
      }
      function step() {
        if (dead || paused) return;
        dir = pending;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        if (head.x < 0 || head.y < 0 || head.x >= SIZE || head.y >= SIZE || occupied(head)) {
          dead = true;
          statusEl.textContent = "撞了，按 R 重开";
          return;
        }
        snake.unshift(head);
        if (same(head, food)) {
          score += 1;
          scoreEl.textContent = String(score);
          spawnFood();
        } else {
          snake.pop();
        }
        draw();
      }
      const keys = {
        ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
        w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
        W: { x: 0, y: -1 }, S: { x: 0, y: 1 }, A: { x: -1, y: 0 }, D: { x: 1, y: 0 },
      };
      canvas.addEventListener("keydown", (event) => {
        if (event.key === " " || event.key === "r" || event.key === "R" || keys[event.key]) {
          event.preventDefault();
        }
        if (event.key === "r" || event.key === "R") {
          reset();
          return;
        }
        if (event.key === " ") {
          if (dead) return;
          paused = !paused;
          statusEl.textContent = paused ? "已暂停" : "进行中";
          return;
        }
        const next = keys[event.key];
        if (!next || next.x === -dir.x && next.y === -dir.y) return;
        pending = next;
        if (!dead) statusEl.textContent = "进行中";
      });
      canvas.addEventListener("pointerdown", () => canvas.focus());
      reset();
      tick = setInterval(step, 140);
    </script>
  </body>
</html>
