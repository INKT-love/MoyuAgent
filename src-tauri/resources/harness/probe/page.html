<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        font-family: "DM Sans", "Noto Sans SC", system-ui, sans-serif;
        color: #355a43;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: #fcfdfc;
      }
      body { padding: 18px 18px 20px; }
      .kicker {
        font-size: 10px;
        letter-spacing: 0.08em;
        color: #8a988f;
        margin-bottom: 6px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 600;
        color: #315941;
      }
      p {
        margin: 0 0 16px;
        font-size: 12px;
        color: #5d7265;
        line-height: 1.6;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }
      .chip {
        height: 28px;
        padding: 0 10px;
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        background: #eef3f0;
        color: #276554;
        font-size: 11px;
      }
      button {
        height: 32px;
        padding: 0 12px;
        border: 0;
        border-radius: 8px;
        background: #276554;
        color: #fff;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover { background: #1e4d3f; }
      pre {
        margin: 12px 0 0;
        font-size: 11px;
        white-space: pre-wrap;
        color: #5d7265;
      }
    </style>
  </head>
  <body>
    <div class="kicker">WASM · BACKEND.WASM</div>
    <h1>WASM 探针</h1>
    <p>这个插件没有改 Agent 代码。点下面按钮会调用 get_engine_status；若 WASM 已注入，返回里会有 probe: wasm-ok。</p>
    <div class="row">
      <span class="chip">backend.wasm</span>
      <span class="chip">before</span>
      <span class="chip">get_engine_status</span>
    </div>
    <button type="button" id="probe">探测 WASM</button>
    <pre id="out">尚未探测</pre>
    <script>
      document.getElementById("probe").addEventListener("click", async () => {
        const out = document.getElementById("out");
        try {
          if (!window.Moyu || typeof window.Moyu.invoke !== "function") {
            throw new Error("Moyu 桥未注入");
          }
          const result = await window.Moyu.invoke("get_engine_status");
          out.textContent = JSON.stringify(result, null, 2);
        } catch (error) {
          out.textContent = String(error);
        }
      });
    </script>
  </body>
</html>
