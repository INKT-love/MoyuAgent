<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        font-family: "DM Sans", "Noto Sans SC", system-ui, sans-serif;
        color: #355a43;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: #fcfdfc;
      }
      body { padding: 18px 18px 20px; }
      .kicker {
        font-size: 10px;
        letter-spacing: 0.08em;
        color: #8a988f;
        margin-bottom: 6px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 600;
        color: #315941;
      }
      h2 {
        margin: 18px 0 8px;
        font-size: 13px;
        font-weight: 600;
        color: #315941;
      }
      p, label, .hint {
        margin: 0 0 12px;
        font-size: 12px;
        color: #5d7265;
        line-height: 1.6;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
      }
      .field span {
        font-size: 11px;
        color: #526c5b;
      }
      input, select, textarea {
        height: 32px;
        padding: 0 10px;
        border: 1px solid #dce4de;
        border-radius: 8px;
        background: #fff;
        color: #315941;
        font: inherit;
        font-size: 12px;
      }
      textarea { height: 64px; padding: 8px 10px; resize: vertical; }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 12px;
        font-size: 12px;
        color: #355a43;
      }
      button {
        height: 32px;
        padding: 0 12px;
        border: 0;
        border-radius: 8px;
        background: #276554;
        color: #fff;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      button.secondary {
        background: #eef3f0;
        color: #276554;
      }
      button:hover { background: #1e4d3f; }
      button.secondary:hover { background: #e2ebe6; }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 8px 0 12px;
      }
      pre {
        margin: 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: #eef3f0;
        font-size: 11px;
        white-space: pre-wrap;
        color: #5d7265;
      }
      .ok { color: #276554; }
      .warn { color: #9a6b2f; }
    </style>
  </head>
  <body>
    <div class="kicker">PLUGIN · SPM</div>
    <h1>SPM 记忆</h1>
    <p>阶段一通过 MCP 把决策写进 SPM；阶段二只裁剪本地旧轮次的文本，工具配对保留，需要时用 recall 取回。</p>

    <h2>阶段一 · MCP</h2>
    <label class="check">
      <input type="checkbox" id="mcpEnabled" />
      启用 SPM MCP（https://api.spmos.ai/mcp）
    </label>
    <div class="field">
      <span>SPM API 密钥</span>
      <input id="apiKey" type="password" autocomplete="off" placeholder="spm_live_..." />
      <div class="hint" id="keyHint">密钥写入系统凭据库，不会进 opencode.json。</div>
    </div>
    <div class="field">
      <span>recall 深度</span>
      <select id="recallDepth">
        <option value="auto">auto</option>
        <option value="fast">fast</option>
        <option value="deep">deep</option>
      </select>
    </div>
    <div class="field">
      <span>user_partition（可选）</span>
      <input id="userPartition" type="text" maxlength="120" placeholder="例如 user-123" />
    </div>

    <h2>阶段二 · 本地裁剪</h2>
    <label class="check">
      <input type="checkbox" id="proxyEnabled" />
      长会话只保留最近两轮完整内容，更早的文本改成占位
    </label>
    <p class="hint">不改 Sub2API 的模型地址。没有本机 Node 代理时，裁剪由本插件的 OpenCode 钩子完成。</p>

    <div class="row">
      <button type="button" id="save">保存并检查</button>
      <button type="button" class="secondary" id="reload">重新读取</button>
      <button type="button" class="secondary" id="clearKey">清除密钥</button>
    </div>
    <pre id="out">尚未读取</pre>
    <script>
      const $ = (id) => document.getElementById(id);

      function applyView(view) {
        const values = view.values || {};
        $("mcpEnabled").checked = Boolean(values.mcpEnabled);
        $("proxyEnabled").checked = Boolean(values.proxyEnabled);
        $("recallDepth").value = values.recallDepth === "fast" || values.recallDepth === "deep"
          ? values.recallDepth
          : "auto";
        $("userPartition").value = typeof values.userPartition === "string" ? values.userPartition : "";
        $("apiKey").value = "";
        $("apiKey").placeholder = view.secrets && view.secrets.apiKey ? "已保存，留空则保持不变" : "spm_live_...";
        $("keyHint").textContent = view.secrets && view.secrets.apiKey
          ? "系统凭据库里已有密钥。"
          : "密钥写入系统凭据库，不会进 opencode.json。";
        const details = (view.applied && view.applied.details) || [];
        const flags = view.applied
          ? [
              view.applied.persisted ? "设置已落盘" : "设置尚未核对落盘",
              view.applied.mcp ? "阶段一 MCP 已写入" : "阶段一 MCP 未写入",
              view.applied.proxy ? "阶段二裁剪已生效" : "阶段二裁剪未生效",
              view.applied.instructions ? "提示词已写入" : "提示词未写入",
            ]
          : [];
        $("out").textContent = [...flags, ...details].join("\n") || "没有返回生效信息";
        $("out").className = view.applied && view.applied.mcp ? "ok" : "warn";
      }

      async function load() {
        const out = $("out");
        try {
          if (!window.Moyu || typeof window.Moyu.invoke !== "function") {
            throw new Error("Moyu 桥未注入");
          }
          const view = await window.Moyu.invoke("get_plugin_settings", { id: "spm" });
          applyView(view);
        } catch (error) {
          out.className = "warn";
          out.textContent = String(error);
        }
      }

      async function save(clearKey) {
        const out = $("out");
        try {
          const values = {
            mcpEnabled: $("mcpEnabled").checked,
            proxyEnabled: $("proxyEnabled").checked,
            recallDepth: $("recallDepth").value,
            userPartition: $("userPartition").value.trim(),
          };
          const payload = { id: "spm", values };
          const typed = $("apiKey").value.trim();
          if (clearKey) payload.secrets = { apiKey: "" };
          else if (typed) payload.secrets = { apiKey: typed };
          const view = await window.Moyu.invoke("set_plugin_settings", payload);
          applyView(view);
        } catch (error) {
          out.className = "warn";
          out.textContent = String(error);
        }
      }

      $("save").addEventListener("click", () => save(false));
      $("reload").addEventListener("click", () => load());
      $("clearKey").addEventListener("click", () => save(true));
      load();
    </script>
  </body>
</html>
